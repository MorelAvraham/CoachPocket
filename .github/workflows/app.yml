name: app

on:
  pull_request:
    paths: ["app/**", ".github/workflows/app.yml"]
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/app.yml"]

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Logic and tools tests
        run: ./gradlew :core:test :tools:test

      - name: Android lint and debug APK
        run: ./gradlew :mobile:lintDebug :mobile:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: coachpocket-debug-apk
          path: app/mobile/build/outputs/apk/debug/mobile-debug.apk
          if-no-files-found: error

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/*/build/reports/
